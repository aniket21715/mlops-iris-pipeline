name: IRIS Pipeline Test and Report

on:
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline-and-test:
    # THIS PERMISSIONS BLOCK IS THE FIX
    permissions:
      contents: read
      pull-requests: write # Allows CML to write comments on the PR

    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository code
      - uses: actions/checkout@v3

      # 2. Setup Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Setup CML
      - name: Setup CML
        uses: iterative/setup-cml@v2
      
      # 4. Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Run the full pipeline
      - name: Run training and evaluation pipeline
        run: |
          python src/train.py
          python src/evaluate.py

      # 6. Run Unit Tests with pytest
      - name: Run data and model unit tests
        run: |
          pytest > pytest_report.txt || true

      # 7. Create a CML report
      - name: Create CML report
        env:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Combine evaluation and pytest reports into one file
          cat evaluation_report.txt >> report.md
          echo "\n## Unit Test Report" >> report.md
          echo '```' >> report.md
          cat pytest_report.txt >> report.md
          echo '```' >> report.md
          
          # Post the combined report as a comment
          cml comment create report.md
